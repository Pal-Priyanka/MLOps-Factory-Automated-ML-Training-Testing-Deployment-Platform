name: MLOps Factory CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-validate:
    name: Lint, Test, and Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code Syntax & Style Linting
        run: |
          # Lint source files with ruff
          ruff check src/ tests/ scripts/

      - name: Execute Automated Test Suite
        run: |
          pytest -v --durations=10

      - name: Validate Container Image Build
        run: |
          docker build -t mlops-factory-api:ci .
